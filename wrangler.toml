name = "beca-comedor-telegram"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[vars]
FIREBASE_PROJECT_ID = "beca-comedor-uabjb"
# Grupo de estudiantes (bot debe ser admin para recibir clics de botones)
TELEGRAM_CHAT_ID = "-1003829511518"
# Grupo interno de cocina (estimado del día)
TELEGRAM_KITCHEN_CHAT_ID = "-1004415815181"
# Orígenes permitidos para /validate, /publicarmenu, /notify-kitchen (coma separada)
ALLOWED_ORIGINS = "http://localhost:5173,https://beca-comedor-uabjb.web.app"

# Cron Triggers (UTC). Bolivia es UTC-4: 12:00 UTC = 08:00, 14:30 UTC = 10:30.
# "* * * * *" revisa cada minuto los envíos programados desde el panel.
[triggers]
crons = ["12 0 * * *", "30 14 * * *", "* * * * *"]

# Secrets (set with `wrangler secret put`):
#   BOT_TOKEN          -> token del bot de Telegram (BotFather)
#   SERVICE_ACCOUNT    -> JSON de cuenta de servicio Firebase (acceso Firestore)
#   WEBHOOK_SECRET     -> secret_token del setWebhook de Telegram

# Despliegue:
#   npx wrangler deploy
#   curl "https://api.telegram.org/bot<BOT_TOKEN>/setWebhook?url=<WORKER_URL>&secret_token=<WEBHOOK_SECRET>"